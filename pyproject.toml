[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ted-tender-radar"
version = "0.1.0"
description = "TED notice intake, normalization, and scoring for procurement ops"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TED Tender Radar contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ted_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
